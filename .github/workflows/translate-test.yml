name: 'Translate GitHub content into English'
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  translate:
    permissions:
      issues: write
      discussions: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Skip translation for ASCII-only pull requests
        id: translation-needed
        env:
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ['EVENT_PATH'], encoding='utf-8') as event_file:
              event = json.load(event_file)
          pull_request = event.get('pull_request') if os.environ['EVENT_NAME'] == 'pull_request_target' else None
          text = '\n'.join(str(pull_request.get(field) or '') for field in ('title', 'body')) if pull_request else ''
          needed = not pull_request or any(ord(char) > 127 and char.isalpha() for char in text)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'needed={str(needed).lower()}\n')
          PY
      - uses: lizheming/github-translate-action@main
        if: steps.translation-needed.outputs.needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          APPEND_TRANSLATION: true
