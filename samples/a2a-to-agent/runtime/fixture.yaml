apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-fixture
  namespace: a2a-agent-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-fixture
  template:
    metadata:
      labels:
        app: agent-fixture
    spec:
      containers:
        - name: fixture
          image: docker.m.daocloud.io/library/python:3.12-alpine
          command: [python3, -u, /code/fixture.py]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: code
              mountPath: /code
            - name: data
              mountPath: /data
      volumes:
        - name: code
          configMap:
            name: agent-fixture-code
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-fixture
  namespace: a2a-agent-demo
spec:
  selector:
    app: agent-fixture
  ports:
    - name: http
      port: 8080
      targetPort: 8080
